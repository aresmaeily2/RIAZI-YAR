name: Android Native V2 CI & Release

on:
  push:
    branches: [ "feat/android-native-v2", "master" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "master" ]
  workflow_dispatch:

jobs:
  build-test-and-lint:
    name: JDK 17 + Android SDK 35 + Unit Tests + Lint + APK/AAB
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run JUnit Test Suite (All 235 JSONs & Engine)
        run: ./gradlew testDebugUnitTest --no-daemon --stacktrace

      - name: Run Android Lint Static Analysis
        run: ./gradlew lintDebug --no-daemon

      - name: Assemble Debug & Release APKs and Release AAB
        env:
          KEYSTORE_PATH: ${{ secrets.KEYSTORE_PATH }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: ./gradlew assembleDebug assembleRelease bundleRelease --no-daemon

      - name: Compute SHA-256 Checksums of Artifacts
        run: |
          sha256sum app/build/outputs/apk/debug/*.apk \
                    app/build/outputs/apk/release/*.apk \
                    app/build/outputs/bundle/release/*.aab | tee SHA256SUMS_ARTIFACTS.txt

      - name: Upload JUnit & Lint Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qa-test-and-lint-reports
          path: |
            app/build/test-results/testDebugUnitTest/*.xml
            app/build/reports/tests/testDebugUnitTest/
            app/build/reports/lint-results-debug.*

      - name: Upload APK & AAB Release Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: riazi-yar-v2.1.0-beta.1-artifacts
          path: |
            app/build/outputs/apk/debug/*.apk
            app/build/outputs/apk/release/*.apk
            app/build/outputs/bundle/release/*.aab
            SHA256SUMS_ARTIFACTS.txt

  instrumented-emulator-tests:
    name: Connected Android Emulator UI Tests (API 34)
    runs-on: macos-latest
    needs: build-test-and-lint
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Setup Gradle 8.10.2
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'

      - name: Run Compose Instrumentation Tests on Android Emulator
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          arch: x86_64
          profile: Nexus 6
          disable-animations: true
          script: ./gradlew connectedDebugAndroidTest --no-daemon
