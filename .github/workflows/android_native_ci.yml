name: Android Native V2 CI - Build APK/AAB, Unit & Emulator Tests

on:
  push:
    branches: [ "feat/android-native-v2" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build_and_verify:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 8.10.2
      - name: Run Unit Tests & Lint
        run: gradle testDebugUnitTest lintDebug --stacktrace
      - name: Build Debug APK
        run: gradle assembleDebug
      - name: Build Release APK & AAB
        run: gradle assembleRelease bundleRelease
      - name: Generate SHA256 Checksums
        run: |
          mkdir -p release_artifacts
          cp app/build/outputs/apk/debug/*.apk release_artifacts/ || true
          cp app/build/outputs/apk/release/*.apk release_artifacts/ || true
          cp app/build/outputs/bundle/release/*.aab release_artifacts/ || true
          shasum -a 256 release_artifacts/* > release_artifacts/SHA256SUMS.txt
      - name: Run UI & Instrumentation Tests on Android Emulator (API 34)
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 34
          script: gradle connectedDebugAndroidTest
      - name: Upload Artifacts & Reports
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: riazi-yar-native-v2-artifacts
          path: |
            release_artifacts/
            app/build/reports/tests/
            app/build/reports/androidTests/
